name: Docker

# 发布双架构镜像到 Docker Hub 和 GHCR。
# main → latest / edge / sha-xxxxxxx；v1.2.3 tag → 1.2.3 / 1.2 / latest。
# 本地 push 到 Docker Hub 常常被网络拦住，所以以这个 workflow 为准。

on:
  push:
    branches: [main]
    tags: ["v*"]
    # 纯文档/CI 配置改动不重建镜像；tag push 不受 path 过滤影响
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKERHUB_IMAGE: youerning/geo-probe
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          labels: |
            org.opencontainers.image.title=GEO Probe
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,prefix=sha-

      # 先单独构建 amd64 并加载到本地，发布前确认基础镜像没有退化。
      - name: Build amd64 for verification
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: geo-probe:verify
          cache-from: type=gha
          provenance: false

      - name: Verify nginx version and protocols
        shell: bash
        run: |
          set -euo pipefail

          version="$(docker run --rm --entrypoint nginx geo-probe:verify -v 2>&1 | awk '{print $3}' | cut -d/ -f2)"
          echo "nginx version: ${version}"
          if [ -z "${version}" ]; then
            echo "::error::could not determine the nginx version"
            exit 1
          fi
          # nginx2root 及 CVE-2026-125283 在 1.31.9 修复；降级直接让发布失败。
          if [ "$(printf '%s\n' "1.31.9" "${version}" | sort -V | head -n1)" != "1.31.9" ]; then
            echo "::error::nginx ${version} is older than 1.31.9 (nginx2root fixes)"
            exit 1
          fi

          # 这个镜像只发静态文件，不应该出现 HTTP/2 或 HTTP/3。
          docker run --rm --entrypoint nginx geo-probe:verify -T 2>&1 | tee /tmp/nginx-effective.conf
          if grep -Eq '^[[:space:]]*http2[[:space:]]+on[[:space:]]*;' /tmp/nginx-effective.conf \
            || grep -Eq '^[[:space:]]*listen[^;]*[[:space:]]http2([[:space:];]|$)' /tmp/nginx-effective.conf; then
            echo "::error::HTTP/2 must stay disabled in this static image"
            exit 1
          fi
          if grep -Eq '^[[:space:]]*http3[[:space:]]+on[[:space:]]*;' /tmp/nginx-effective.conf \
            || grep -Eq '^[[:space:]]*listen[^;]*[[:space:]]quic([[:space:];]|$)' /tmp/nginx-effective.conf; then
            echo "::error::HTTP/3 must stay disabled in this static image"
            exit 1
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
