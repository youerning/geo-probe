# GEO Probe 静态站点。nginx 只负责把 out/ 发出去，没有服务端逻辑。
# 由 Dockerfile 覆盖 /etc/nginx/conf.d/default.conf。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # 目录跳转（/runs → /runs/）必须用相对 Location。
    # 默认的 absolute_redirect 会用 $host 拼绝对地址，$host 不含端口，
    # 于是 -p 8080:80 或反代场景会跳到错误的 http://host/runs/。
    absolute_redirect off;

    # 与 public/_headers、vercel.json 保持一致。
    # 坑：nginx 的 add_header 不会从上层继承——只要 location 里出现一个
    # add_header，server 级的这些安全头在该 location 就会全部失效。
    # 所以下面的 location 一律不写 add_header，缓存用 expires 指令。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.deepseek.com https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # 容器 HEALTHCHECK 用，不打访问日志
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 文件名带构建 hash，可以长缓存。expires 会自动生成 max-age=31536000。
    location /_next/static/ {
        expires 1y;
        try_files $uri =404;
        access_log off;
    }

    # 示例数据约 400 KB，和 Cloudflare Pages 的配置保持一致
    location /demo/ {
        expires 1h;
        try_files $uri =404;
    }

    # 构建产物里的 _headers 是给 Cloudflare Pages / Netlify 用的，别对外暴露
    location = /_headers {
        return 404;
    }

    # trailingSlash: true → 每个页面都是 <dir>/index.html。
    # $uri/ 命中目录时 nginx 会自动 301 到带斜杠的地址，
    # 所以 /runs/?run=xxx 刷新不会 404，/runs 也会被纠正到 /runs/。
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
